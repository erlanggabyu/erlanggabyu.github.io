<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Logo monogram EB">
  <!-- LOGO MONOGRAM — ganti huruf "EB" di elemen <text> dengan inisial Anda -->
  <style>
    .c { fill: none; stroke: #141414; stroke-width: 1.25; }
    .t { fill: #141414; font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 25px; letter-spacing: -1.5px; }
    @media (prefers-color-scheme: dark) { .c { stroke: #eeeeee; } .t { fill: #eeeeee; } }
  </style>
  <circle class="c" cx="32" cy="32" r="30.5"/>
  <text class="t" x="32" y="40.5" text-anchor="middle">EB</text>
</svg>
